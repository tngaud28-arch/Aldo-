<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>aldo</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Georgia', serif;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  h1 {
    color: #fff5e6;
    font-size: 7rem;
    margin: 0;
    letter-spacing: 0.12em;
    text-shadow:
      0 0 12px #ffb347,
      0 0 24px #ff7f11,
      0 0 48px #ff4500,
      0 0 90px #ff2200;
    animation: glow 2.2s ease-in-out infinite alternate;
    z-index: 3;
    position: relative;
  }

  @keyframes glow {
    from {
      text-shadow:
        0 0 10px #ffb347, 0 0 20px #ff7f11, 0 0 40px #ff4500, 0 0 70px #ff2200;
    }
    to {
      text-shadow:
        0 0 18px #fff0c8, 0 0 30px #ffb347, 0 0 60px #ff5e00, 0 0 100px #ff2200;
    }
  }

  #fireCanvas {
    display: block;
    width: 100%;
    height: 50vh;
  }
</style>
</head>
<body>
  <div class="scene">
    <h1>aldo</h1>
    <canvas id="fireCanvas"></canvas>
  </div>

<script>
const canvas = document.getElementById('fireCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.5;
}
resize();
window.addEventListener('resize', resize);

let t = 0;

// simple pseudo-noise using layered sines for organic flicker
function noise(x, y, time) {
  return (
    Math.sin(x * 0.02 + time * 1.3) +
    Math.sin(y * 0.05 - time * 2.1) +
    Math.sin((x + y) * 0.015 + time * 0.7)
  ) / 3;
}

class FlameParticle {
  constructor() { this.reset(true); }
  reset(initial) {
    const W = canvas.width;
    this.baseX = Math.random() * W;
    this.x = this.baseX;
    this.y = canvas.height + Math.random() * 10;
    if (initial) this.y = canvas.height - Math.random() * canvas.height * 0.6;
    this.speed = 2.2 + Math.random() * 3.2;
    this.life = 1;
    this.maxLife = 1;
    this.decay = 0.008 + Math.random() * 0.014;
    this.radius = 24 + Math.random() * 36;
    this.phase = Math.random() * Math.PI * 2;
    this.sway = 0.4 + Math.random() * 1.4;
  }
  update() {
    const n = noise(this.baseX, this.y, t);
    this.x = this.baseX + n * 40 * this.sway + Math.sin(this.phase + t * 3) * 8;
    this.y -= this.speed * (0.6 + Math.abs(n));
    this.speed += 0.02;
    this.life -= this.decay;
    this.radius *= 0.982;
    if (this.life <= 0 || this.radius < 2) this.reset(false);
  }
  draw() {
    const lifeRatio = this.life / this.maxLife;
    let r, g, b;
    if (lifeRatio > 0.85) { r = 255; g = 255; b = 235; }
    else if (lifeRatio > 0.6) { r = 255; g = 214; b = 90; }
    else if (lifeRatio > 0.35) { r = 255; g = 130; b = 20; }
    else if (lifeRatio > 0.15) { r = 220; g = 60; b = 10; }
    else { r = 90; g = 20; b = 10; }

    const alpha = Math.max(lifeRatio, 0) * 0.85;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
    grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(0.4, `rgba(${r},${g*0.55},${b*0.2},${alpha*0.55})`);
    grad.addColorStop(1, `rgba(${r},${g*0.2},0,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(this.radius, 0), 0, Math.PI * 2);
    ctx.fill();
  }
}

class Spark {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height - Math.random() * 40;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = -(3 + Math.random() * 4);
    this.life = 1;
    this.decay = 0.004 + Math.random() * 0.01;
    this.size = 1 + Math.random() * 2.2;
  }
  update() {
    this.x += this.vx + Math.sin(this.y * 0.03 + t) * 0.8;
    this.y += this.vy;
    this.vy += 0.01;
    this.life -= this.decay;
    if (this.life <= 0) this.reset();
  }
  draw() {
    const alpha = Math.max(this.life, 0);
    ctx.fillStyle = `rgba(255, ${140 + Math.floor(90 * this.life)}, 50, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Smoke {
  constructor() { this.reset(true); }
  reset(initial) {
    this.x = Math.random() * canvas.width;
    this.y = initial ? Math.random() * canvas.height * 0.3 : canvas.height * 0.15;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = -(0.4 + Math.random() * 0.6);
    this.radius = 30 + Math.random() * 50;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.004;
  }
  update() {
    this.x += this.vx + Math.sin(t + this.y * 0.01) * 0.3;
    this.y += this.vy;
    this.radius += 0.15;
    this.life -= this.decay;
    if (this.life <= 0) this.reset(false);
  }
  draw() {
    const alpha = Math.max(this.life, 0) * 0.08;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
    grad.addColorStop(0, `rgba(60,55,50,${alpha})`);
    grad.addColorStop(1, `rgba(20,20,20,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

let flames = [];
let sparks = [];
let smokes = [];

function initParticles() {
  flames = [];
  sparks = [];
  smokes = [];
  const flameCount = Math.floor(canvas.width / 4);
  for (let i = 0; i < flameCount; i++) {
    const p = new FlameParticle();
    p.life = Math.random();
    flames.push(p);
  }
  const sparkCount = Math.floor(canvas.width / 15);
  for (let i = 0; i < sparkCount; i++) {
    const s = new Spark();
    s.life = Math.random();
    sparks.push(s);
  }
  for (let i = 0; i < 12; i++) {
    const s = new Smoke();
    s.life = Math.random();
    smokes.push(s);
  }
}
initParticles();
window.addEventListener('resize', () => setTimeout(initParticles, 100));

function animate() {
  t += 0.016;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.globalCompositeOperation = 'source-over';
  for (const s of smokes) { s.update(); s.draw(); }

  ctx.globalCompositeOperation = 'lighter';
  for (const p of flames) { p.update(); p.draw(); }
  for (const s of sparks) { s.update(); s.draw(); }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
